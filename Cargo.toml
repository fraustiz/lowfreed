[package]
name = "lowfreed"
version = "0.1.0"
edition = "2021"
description = "Configurateur du clavier Lofree Flow 2 (protocole VIA)"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
